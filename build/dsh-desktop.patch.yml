# DSH Desktop delegates directory selection to Electron's system dialog. Keep
# the renderless client surface, but do not load the Koffi-based Host worker:
# on Windows it can exit before reporting a result inside packaged Electron.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-electron-desktop-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # The market is a first-party Desktop capability. Its server routes still
    # use dsh-market upstream, while this small host bridge supplies the fixed
    # Desktop profile and the packaged Node/pnpm execution boundary.
    - id: dsh-desktop-plugin-runtime
      name: dsh-desktop-plugin-runtime

    - id: dsh-market
      name: dshmarket
      inject: [desktopProfiles]
      config:
        profile: web
        allowRestart: false
