<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; color: #17181a; background: #f8f8f6; }
      main { display: grid; justify-items: center; gap: 12px; padding: 32px; text-align: center; }
      .mark { width: 154px; height: auto; animation: breathe 1.8s ease-in-out infinite alternate; }
      .title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
      .status { margin: -4px 0 0; color: #777a80; font-size: 13px; }
      @keyframes breathe { to { opacity: .72; transform: translateY(-4px) scale(.985); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
      @media (prefers-color-scheme: dark) {
        body { color: #f3f4f6; background: #141416; }
        .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="brand.png" alt="" />
      <h1 class="title" id="title">正在启动 DSH Desktop</h1>
      <p class="status" id="status">首次启动可能需要一点时间。</p>
    </main>
    <script>
      if (!navigator.language.toLowerCase().startsWith('zh')) {
        document.documentElement.lang = 'en'
        document.getElementById('title').textContent = 'Starting DSH Desktop'
        document.getElementById('status').textContent = 'First launch may take a moment.'
      }
    </script>
  </body>
</html>
